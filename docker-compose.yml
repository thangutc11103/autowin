# Docker Compose for Development
# Usage: docker-compose up

version: '3.8'

services:
  # Redis Service
  redis:
    image: redis:latest
    container_name: find-app-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Next.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: find-app
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  # Worker Service (Optional)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: find-app-worker
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run worker

volumes:
  redis_data:

networks:
  default:
    name: find-app-network
